                    },
                    { 
                        roleName: 'نائب رئیس هیئت مدیره', 
                        userName: users.find(u => u.username === signerRoles.naeb)?.displayName || signerRoles.naeb,
                        x: 138, 
                        y: sigStartY + sigTitlePdfHeight + 6, 
                        sig: naebSig 
                    }
                ];

                const loadImageToPDF = (url) => {
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.crossOrigin = 'anonymous';
                        img.onload = () => resolve(img);
                        img.onerror = () => resolve(img);
                        img.src = url;
                    });
                };

                for (let slot of slots) {
                    doc.setFillColor(255, 255, 255);
                    doc.setDrawColor(203, 213, 225);
                    doc.setLineWidth(0.3);
                    doc.roundedRect(slot.x, slot.y, 54, 42, 2, 2, 'FD');

                    const rLabelObj = textToCanvasURL(slot.roleName, 10.5, '#475569', 200);
                    const rLabelPdfWidth = 40;
                    const rLabelPdfHeight = (rLabelObj.height / rLabelObj.width) * rLabelPdfWidth;
                    const rx = slot.x + (54 - rLabelPdfWidth) / 2 + 3;
                    doc.addImage(rLabelObj.dataUrl, 'PNG', rx, slot.y + 3, rLabelPdfWidth, rLabelPdfHeight);

                    const uLabelObj = textToCanvasURL(slot.userName, 9.5, '#64748b', 200);
                    const uLabelPdfWidth = 35;
                    const uLabelPdfHeight = (uLabelObj.height / uLabelObj.width) * uLabelPdfWidth;
                    const ux = slot.x + (54 - uLabelPdfWidth) / 2 + 2.5;
                    doc.addImage(uLabelObj.dataUrl, 'PNG', ux, slot.y + 8, uLabelPdfWidth, uLabelPdfHeight);

                    doc.setDrawColor(226, 232, 240);
                    doc.rect(slot.x + 4, slot.y + 14, 46, 20);

                    if (slot.sig && slot.sig.dataUrl) {
                        try {
                            const img = await loadImageToPDF(slot.sig.dataUrl);
                            if (img && img.width > 0) {
                                doc.addImage(img, 'PNG', slot.x + 5, slot.y + 15, 44, 18);
                            }
                        } catch (err) {
                            console.error(err);
                        }

                        const signTime = new Date(slot.sig.time);
                        const pSignDate = new Intl.DateTimeFormat('fa-IR', {
                            year: 'numeric', month: '2-digit', day: '2-digit'
                        }).format(signTime);
                        
                        const timeObj = textToCanvasURL(`امضا شده در: ${pSignDate}`, 8, '#059669', 200);
                        const timePdfWidth = 35;
                        const timePdfHeight = (timeObj.height / timeObj.width) * timePdfWidth;
                        const tx = slot.x + (54 - timePdfWidth) / 2 + 2;
                        doc.addImage(timeObj.dataUrl, 'PNG', tx, slot.y + 35, timePdfWidth, timePdfHeight);
                    } else {
                        const waitObj = textToCanvasURL('در انتظار امضا...', 9, '#94a3b8', 200);
                        const waitPdfWidth = 25;
                        const waitPdfHeight = (waitObj.height / waitObj.width) * waitPdfWidth;
                        const wx = slot.x + (54 - waitPdfWidth) / 2 + 1.5;
                        doc.addImage(waitObj.dataUrl, 'PNG', wx, slot.y + 22, waitPdfWidth, waitPdfHeight);
                    }
                }

                const footerTextObj = textToCanvasURL('سامانه هوشمند مدیریت خزانه و حوالجات مالی - امنیت تضمین‌شده با فناوری Supabase', 9, '#94a3b8', 600);
                const footerPdfWidth = 140;
                const footerPdfHeight = (footerTextObj.height / footerTextObj.width) * footerPdfWidth;
                doc.addImage(footerTextObj.dataUrl, 'PNG', 35, 272, footerPdfWidth, footerPdfHeight);

                return doc;
            };

            const handleDownloadPDF = async (req) => {
                const hasKhaaneh = req.signatures.some(s => signerRoles.khaaneh === s.signer);
                const hasRaees = req.signatures.some(s => signerRoles.raees === s.signer);
                const hasNaeb = req.signatures.some(s => signerRoles.naeb === s.signer);

                if (!hasKhaaneh || (!hasRaees && !hasNaeb)) {
                    showToast('❌ ترکیب امضاها نامعتبر است و این حواله هنوز رسمیت ندارد.', 'error');
                    return;
                }

                showToast('در حال آماده‌سازی و ساخت فایل PDF...', 'info');
                try {
                    const doc = await buildPDFDoc(req);
                    doc.save(`حواله-خزانه-${req.title}-${req.reqId}.pdf`);
                    showToast('فایل PDF با موفقیت دانلود شد.', 'success');
                } catch (err) {
                    console.error(err);
                    showToast('خطا در تولید فایل PDF.', 'error');
                }
            };

            const handlePreviewPDF = async (req) => {
                showToast('در حال ایجاد پیش‌نمایش PDF...', 'info');
                try {
                    const doc = await buildPDFDoc(req);
                    const pdfBlob = doc.output('blob');
                    const blobUrl = URL.createObjectURL(pdfBlob);
                    window.open(blobUrl, '_blank');
                    showToast('پیش‌نمایش PDF در زبانه جدید باز شد.', 'success');
                } catch (err) {
                    console.error(err);
                    showToast('خطا در بارگذاری پیش‌نمایش PDF.', 'error');
                }
            };

            // Budget statistics
            const getApprovedTotal = () => {
                return requests
                    .filter(r => r.status === 'approved')
                    .reduce((sum, r) => sum + r.amount, 0);
            };

            const getApprovedAverage = () => {
                const approved = requests.filter(r => r.status === 'approved');
                if (approved.length === 0) return 0;
                return Math.round(getApprovedTotal() / approved.length);
            };

            const getSignatureStatusDetails = (req) => {
                const hasKhaaneh = req.signatures.some(s => signerRoles.khaaneh === s.signer);
                const hasRaees = req.signatures.some(s => signerRoles.raees === s.signer);
                const hasNaeb = req.signatures.some(s => signerRoles.naeb === s.signer);

                const needed = [];
                if (!hasKhaaneh) needed.push('خزانه‌دار (اجباری)');
                if (!hasRaees && !hasNaeb) needed.push('رئیس یا نائب رئیس');

                return {
                    isValid: hasKhaaneh && (hasRaees || hasNaeb),
                    needed: needed.join(' و ')
                };
            };

            // ===================== JSX RENDERING =====================
            return (
                <div className="min-h-screen font-sans transition-all duration-300">
                    
                    {/* Toast notifications */}
                    <div className="fixed top-5 left-1/2 -translate-x-1/2 z-[9999] flex flex-col gap-2 w-full max-w-md px-4">
                        {toasts.map(toast => (
                            <div 
                                key={toast.id} 
                                className={`flex items-center gap-3 px-5 py-4 rounded-2xl shadow-2xl backdrop-blur-md border ${
                                    toast.type === 'success' 
                                        ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400' 
                                        : toast.type === 'error'
                                        ? 'bg-rose-500/10 border-rose-500/20 text-rose-400'
                                        : toast.type === 'warning'
                                        ? 'bg-amber-500/10 border-amber-500/20 text-amber-400'
                                        : 'bg-indigo-500/10 border-indigo-500/20 text-indigo-400'
                                }`}
                            >
                                <span className="text-sm font-medium leading-relaxed">{toast.message}</span>
                            </div>
                        ))}
                    </div>

                    {/* Floating Theme Button */}
                    <div className="fixed top-5 left-5 z-[999]">
                        <button 
                            onClick={toggleTheme}
                            className={`h-11 w-11 rounded-full flex items-center justify-center cursor-pointer border shadow-lg transition-all ${
                                theme === 'dark' 
                                    ? 'bg-[#14192d]/80 border-slate-700/60 text-amber-400' 
                                    : 'bg-white/90 border-slate-200 text-indigo-600'
                            }`}
                        >
                            {theme === 'dark' ? '☀️' : '🌙'}
                        </button>
                    </div>

                    {/* 1. LOGIN PAGE */}
                    {!currentUser ? (
                        <div className="flex min-h-screen items-center justify-center p-4">
                            <div className="w-full max-w-md">
                                <div className={`p-8 rounded-3xl border shadow-2xl backdrop-blur-xl transition-all ${
                                    theme === 'dark' 
                                        ? 'bg-[#14192d]/80 border-slate-800/80 text-slate-100' 
                                        : 'bg-white border-slate-200 text-slate-800'
                                }`}>
                                    <div className="text-center mb-8">
                                        <div className="inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 shadow-xl mb-4">
                                            🔒
                                        </div>
                                        <h1 className="text-2xl font-black bg-gradient-to-r from-indigo-400 via-purple-400 to-indigo-400 bg-clip-text text-transparent">🔐 خزانه هوشمند ساختمان</h1>
                                        <p className="text-sm mt-2 text-slate-400">سامانه جامع مدیریت برداشت‌ها و امضای دیجیتال</p>
                                    </div>

                                    <form onSubmit={handleLogin} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-semibold mb-2">نام کاربری</label>
                                            <input 
                                                type="text" 
                                                value={loginUsername}
                                                onChange={e => setLoginUsername(e.target.value)}
                                                placeholder="نام کاربری خود را وارد کنید"
                                                className={`w-full px-4 py-3 rounded-2xl border text-sm outline-none transition-all ${
                                                    theme === 'dark'
                                                        ? 'bg-slate-900/60 border-slate-800 focus:border-indigo-500 text-white'
                                                        : 'bg-slate-50 border-slate-200 focus:border-indigo-600 text-slate-800'
                                                }`}
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold mb-2">رمز عبور</label>
                                            <input 
                                                type="password" 
                                                value={loginPassword}
                                                onChange={e => setLoginPassword(e.target.value)}
                                                placeholder="رمز عبور خود را وارد کنید"
                                                className={`w-full px-4 py-3 rounded-2xl border text-sm outline-none transition-all ${
                                                    theme === 'dark'
                                                        ? 'bg-slate-900/60 border-slate-800 focus:border-indigo-500 text-white'
                                                        : 'bg-slate-50 border-slate-200 focus:border-indigo-600 text-slate-800'
                                                }`}
                                            />
                                        </div>

                                        {loginError && (
                                            <div className="text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 p-3 rounded-xl">
                                                ⚠️ {loginError}
                                            </div>
                                        )}

                                        <button 
                                            type="submit" 
                                            disabled={loading}
                                            className="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold py-3.5 px-6 rounded-2xl shadow-xl transition-all flex items-center justify-center gap-2 cursor-pointer"
                                        >
                                            {loading ? 'در حال ورود...' : 'ورود به سامانه ➡️'}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    ) : (
                        // 2. MAIN DASHBOARD
                        <div className="max-w-6xl mx-auto px-4 py-8">
                            <header className={`p-6 rounded-3xl border mb-6 flex flex-col md:flex-row items-center justify-between gap-4 shadow-xl ${
                                theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80 text-white' : 'bg-white border-slate-200 text-slate-800'
                            }`}>
                                <div className="flex items-center gap-4">
                                    <div className="h-14 w-14 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-500 text-xl">
                                        👤
                                    </div>
                                    <div>
                                        <h2 className="text-lg font-extrabold">{currentUser.displayName || currentUser.username}</h2>
                                        <div className="flex items-center gap-2 mt-1">
                                            <span className="text-[11px] px-2 py-0.5 rounded-full font-bold uppercase bg-indigo-500/15 text-indigo-400 border border-indigo-500/20">
                                                {currentUser.role === 'admin' ? 'مدیر کل (Admin)' : currentUser.role === 'requester' ? 'ثبت‌کننده (Requester)' : `امضاکننده: ${getRoleLabel(currentUser.username)}`}
                                            </span>
                                            {dbLoading && <span className="text-xs text-slate-400 animate-pulse">در حال بروزرسانی...</span>}
                                        </div>
                                    </div>
                                </div>

                                <div className="flex items-center gap-3">
                                    <button 
                                        onClick={openProfileModal}
                                        className={`px-4 py-2.5 rounded-2xl text-sm font-semibold border transition-all ${
                                            theme === 'dark' ? 'bg-slate-900/40 border-slate-800 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-600'
                                        }`}
                                    >
                                        ✏️ ویرایش مشخصات
                                    </button>
                                    <button 
                                        onClick={handleLogout}
                                        className="px-4 py-2.5 rounded-2xl text-sm font-semibold bg-rose-500/10 border border-rose-500/20 text-rose-400"
                                    >
                                        🚪 خروج
                                    </button>
                                </div>
                            </header>

                            {/* ADMIN PANEL */}
                            {currentUser.role === 'admin' && (
                                <div>
                                    <div className="flex border-b border-slate-800/40 mb-6 overflow-x-auto pb-1 gap-2">
                                        <button 
                                            onClick={() => setActiveTab('requests')}
                                            className={`px-6 py-3 rounded-t-2xl font-bold text-sm border-b-2 ${
                                                activeTab === 'requests' ? 'border-indigo-500 text-indigo-400 bg-indigo-500/5' : 'border-transparent text-slate-400'
                                            }`}
                                        >
                                            📋 درخواست‌ها ({requests.length})
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab('users')}
                                            className={`px-6 py-3 rounded-t-2xl font-bold text-sm border-b-2 ${
                                                activeTab === 'users' ? 'border-indigo-500 text-indigo-400 bg-indigo-500/5' : 'border-transparent text-slate-400'
                                            }`}
                                        >
                                            👥 کاربران ({users.length})
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab('roles')}
                                            className={`px-6 py-3 rounded-t-2xl font-bold text-sm border-b-2 ${
                                                activeTab === 'roles' ? 'border-indigo-500 text-indigo-400 bg-indigo-500/5' : 'border-transparent text-slate-400'
                                            }`}
                                        >
                                            ⚙️ نقش‌های امضا
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab('prediction')}
                                            className={`px-6 py-3 rounded-t-2xl font-bold text-sm border-b-2 ${
                                                activeTab === 'prediction' ? 'border-indigo-500 text-indigo-400 bg-indigo-500/5' : 'border-transparent text-slate-400'
                                            }`}
                                        >
                                            📊 آمار و بودجه
                                        </button>
                                    </div>

                                    {activeTab === 'requests' && (
                                        <div className={`p-6 rounded-3xl border shadow-lg ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                            <h3 className="text-base font-bold mb-4">📋 لیست کل درخواست‌های برداشت</h3>
                                            <RequestsList 
                                                requests={requests} 
                                                theme={theme} 
                                                onOpenDetail={setSelectedRequest} 
                                                onDelete={handleDeleteRequest} 
                                                onReject={handleRejectRequest}
                                                isAdmin={true}
                                                getSignatureStatusDetails={getSignatureStatusDetails}
                                            />
                                        </div>
                                    )}

                                    {activeTab === 'users' && (
                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                            <div className={`p-6 rounded-3xl border shadow-lg h-fit ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                                <h3 className="text-base font-bold mb-4">➕ افزودن کاربر جدید</h3>
                                                <form onSubmit={handleAddUser} className="space-y-4">
                                                    <div>
                                                        <label className="block text-xs font-semibold mb-1.5">نام کاربری</label>
                                                        <input 
                                                            type="text" 
                                                            value={addUname}
                                                            onChange={e => setAddUname(e.target.value)}
                                                            className={`w-full px-4 py-2.5 rounded-xl border text-sm outline-none ${
                                                                theme === 'dark' ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-200 text-slate-800'
                                                            }`}
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-semibold mb-1.5">نام نمایشی (فارسی)</label>
                                                        <input 
                                                            type="text" 
                                                            value={addDname}
                                                            onChange={e => setAddDname(e.target.value)}
                                                            className={`w-full px-4 py-2.5 rounded-xl border text-sm outline-none ${
                                                                theme === 'dark' ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-200 text-slate-800'
                                                            }`}
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-semibold mb-1.5">رمز عبور</label>
                                                        <input 
                                                            type="text" 
                                                            value={addPass}
                                                            onChange={e => setAddPass(e.target.value)}
                                                            className={`w-full px-4 py-2.5 rounded-xl border text-sm outline-none ${
                                                                theme === 'dark' ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-200 text-slate-800'
                                                            }`}
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-semibold mb-1.5">نقش کاربر</label>
                                                        <select 
                                                            value={addRole}
                                                            onChange={e => setAddRole(e.target.value)}
                                                            className={`w-full px-4 py-2.5 rounded-xl border text-sm outline-none ${
                                                                theme === 'dark' ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-200 text-slate-800'
                                                            }`}
                                                        >
                                                            <option value="admin">مدیر سیستم (Admin)</option>
                                                            <option value="requester">ثبت‌کننده درخواست (Requester)</option>
                                                            <option value="signer">امضاکننده مالی (Signer)</option>
                                                            <option value="viewer">فقط مشاهده‌گر (Viewer)</option>
                                                        </select>
                                                    </div>
                                                    <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-sm">➕ ثبت کاربر</button>
                                                </form>
                                            </div>

                                            <div className={`p-6 rounded-3xl border shadow-lg lg:col-span-2 ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                                <h3 className="text-base font-bold mb-4">👥 کل کاربران سامانه</h3>
                                                <div className="overflow-x-auto">
                                                    <table className="w-full text-sm text-right">
                                                        <thead>
                                                            <tr className="border-b border-slate-800/60 text-slate-400">
                                                                <th className="py-2.5">نام نمایشی</th>
                                                                <th className="py-2.5">نام کاربری</th>
                                                                <th className="py-2.5">نقش</th>
                                                                <th className="py-2.5 text-left">عملیات</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {users.map(u => (
                                                                <tr key={u.username} className="border-b border-slate-800/20">
                                                                    <td className="py-3 font-semibold">{u.displayName || u.username}</td>
                                                                    <td className="py-3 font-mono text-slate-400">{u.username}</td>
                                                                    <td className="py-3">
                                                                        <span className="text-xs px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-400">{u.role}</span>
                                                                    </td>
                                                                    <td className="py-3 text-left">
                                                                        <button onClick={() => openEditUserModal(u)} className="text-xs text-indigo-400 hover:underline">ویرایش 🔑</button>
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {activeTab === 'roles' && (
                                        <div className={`p-6 rounded-3xl border shadow-lg ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                            <h3 className="text-base font-bold mb-2">⚙️ تنظیم سمت‌های قانونی امضا</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 my-4">
                                                <div>
                                                    <label className="block text-xs font-bold mb-2">رئیس هیئت مدیره</label>
                                                    <select value={signerRoles.raees} onChange={e => setSignerRoles(prev => ({...prev, raees: e.target.value}))} className="w-full p-2.5 rounded-xl border bg-transparent">
                                                        {users.map(u => <option key={u.username} value={u.username} className="bg-slate-900">{u.displayName || u.username}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold mb-2">خزانه‌دار (امضای الزامی)</label>
                                                    <select value={signerRoles.khaaneh} onChange={e => setSignerRoles(prev => ({...prev, khaaneh: e.target.value}))} className="w-full p-2.5 rounded-xl border bg-transparent">
                                                        {users.map(u => <option key={u.username} value={u.username} className="bg-slate-900">{u.displayName || u.username}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold mb-2">نائب رئیس</label>
                                                    <select value={signerRoles.naeb} onChange={e => setSignerRoles(prev => ({...prev, naeb: e.target.value}))} className="w-full p-2.5 rounded-xl border bg-transparent">
                                                        {users.map(u => <option key={u.username} value={u.username} className="bg-slate-900">{u.displayName || u.username}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                            <button onClick={handleSaveSignerRoles} className="bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold mt-2">💾 ذخیره تغییرات</button>
                                        </div>
                                    )}

                                    {activeTab === 'prediction' && (
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                            <div className={`p-6 rounded-3xl border shadow-lg ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                                <h4 className="text-xs text-slate-400">کل مبالغ مصوب و تأییدشده</h4>
                                                <p className="text-2xl font-bold text-indigo-400 mt-2">{getApprovedTotal().toLocaleString()} تومان</p>
                                            </div>
                                            <div className={`p-6 rounded-3xl border shadow-lg ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                                <h4 className="text-xs text-slate-400">میانگین هر حواله</h4>
                                                <p className="text-2xl font-bold text-emerald-400 mt-2">{getApprovedAverage().toLocaleString()} تومان</p>
                                            </div>
                                            <div className={`p-6 rounded-3xl border shadow-lg ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                                <h4 className="text-xs text-slate-400">کل درخواست‌ها در انتظار</h4>
                                                <p className="text-2xl font-bold text-amber-400 mt-2">{requests.filter(r => r.status === 'pending').length} عدد</p>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* REQUESTER PANEL */}
                            {currentUser.role === 'requester' && (
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className={`p-6 rounded-3xl border shadow-lg h-fit ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                        <h3 className="text-base font-bold mb-4">✍️ ثبت درخواست جدید برداشت</h3>
                                        <form onSubmit={handleCreateRequest} className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-semibold mb-1.5">عنوان حواله</label>
                                                <input type="text" value={newTitle} onChange={e => setNewTitle(e.target.value)} placeholder="مثلاً هزینه تعمیر آسانسور" className="w-full p-2.5 rounded-xl border bg-transparent text-sm"/>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold mb-1.5">مبلغ (تومان)</label>
                                                <input type="number" value={newAmount} onChange={e => setNewAmount(e.target.value)} placeholder="مبلغ به عدد" className="w-full p-2.5 rounded-xl border bg-transparent text-sm"/>
                                                {newAmount && <div className="text-[10px] text-indigo-400 mt-1">✍️ به حروف: {numberToPersianWords(Number(newAmount))}</div>}
                                            </div>
                                            <div>
                                                <div className="flex justify-between mb-1">
                                                    <label className="text-xs font-semibold">توضیحات و فاکتور</label>
                                                    <button type="button" onClick={handleCheckSpelling} className="text-[10px] text-indigo-400">بررسی املای فارسی 🔎</button>
                                                </div>
                                                <textarea rows="3" value={newDesc} onChange={e => setNewDesc(e.target.value)} placeholder="شرح خرید..." className="w-full p-2.5 rounded-xl border bg-transparent text-sm"/>
                                                {spellCheckMsg && (
                                                    <div className="text-xs p-2 rounded bg-indigo-500/10 border mt-1">
                                                        {spellCheckMsg.text}
                                                        {spellCheckMsg.type === 'warning' && <button type="button" onClick={handleFixSpelling} className="block text-[10px] text-amber-400 underline mt-1">اصلاح خودکار حروف عربی</button>}
                                                    </div>
                                                )}
                                            </div>
                                            <div className="grid grid-cols-2 gap-3">
                                                <div>
                                                    <label className="block text-xs font-semibold mb-1">مهلت (شمسی)</label>
                                                    <input type="text" value={newExpiryShamsi} onChange={e => setNewExpiryShamsi(e.target.value)} placeholder="۱۴۰۴/۰۶/۱۵" className="w-full p-2.5 rounded-xl border bg-transparent text-xs text-center"/>
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold mb-1">فایل فاکتور</label>
                                                    <input type="file" onChange={e => setNewFile(e.target.files[0])} className="text-[10px] text-slate-500 w-full mt-2"/>
                                                </div>
                                            </div>
                                            <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-sm">ثبت و ارسال درخواست</button>
                                        </form>
                                    </div>

                                    <div className={`p-6 rounded-3xl border shadow-lg lg:col-span-2 ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                        <h3 className="text-base font-bold mb-4">📋 درخواست‌های ثبت‌شده توسط من</h3>
                                        <RequestsList 
                                            requests={requests.filter(r => r.requester === currentUser.username)} 
                                            theme={theme} 
                                            onOpenDetail={setSelectedRequest} 
                                            onDelete={handleDeleteRequest} 
                                            onReject={handleRejectRequest}
                                            onReverseReject={handleReverseReject}
                                            isAdmin={false}
                                            getSignatureStatusDetails={getSignatureStatusDetails}
                                        />
                                    </div>
                                </div>
                            )}

                            {/* SIGNER PANEL */}
                            {currentUser.role === 'signer' && (
                                <div className="space-y-6">
                                    <div className={`p-6 rounded-3xl border shadow-lg ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                        <h3 className="text-base font-bold mb-4 text-amber-400">🖋️ حوالجات در انتظار امضا و تایید شما</h3>
                                        <RequestsList 
                                            requests={requests.filter(r => r.status === 'pending' && !r.signatures.some(s => s.signer === currentUser.username))} 
                                            theme={theme} 
                                            onOpenDetail={setSelectedRequest} 
                                            onDelete={handleDeleteRequest} 
                                            onReject={handleRejectRequest}
                                            isAdmin={false}
                                            getSignatureStatusDetails={getSignatureStatusDetails}
                                        />
                                    </div>

                                    <div className={`p-6 rounded-3xl border shadow-lg ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                        <h3 className="text-base font-bold mb-4 text-indigo-400">✅ حوالجاتی که توسط شما امضا شده‌اند</h3>
                                        <RequestsList 
                                            requests={requests.filter(r => r.signatures.some(s => s.signer === currentUser.username))} 
                                            theme={theme} 
                                            onOpenDetail={setSelectedRequest} 
                                            onDelete={handleDeleteRequest} 
                                            onReject={handleRejectRequest}
                                            isAdmin={false}
                                            getSignatureStatusDetails={getSignatureStatusDetails}
                                        />
                                    </div>
                                </div>
                            )}

                            {/* VIEWER PANEL */}
                            {currentUser.role === 'viewer' && (
                                <div className={`p-6 rounded-3xl border shadow-lg ${theme === 'dark' ? 'bg-[#14192d]/85 border-slate-800/80' : 'bg-white border-slate-200'}`}>
                                    <h3 className="text-base font-bold mb-4">👁️ مشاهده تمامی حواله‌های مصوب ساختمان</h3>
                                    <RequestsList 
                                        requests={requests} 
                                        theme={theme} 
                                        onOpenDetail={setSelectedRequest} 
                                        onDelete={handleDeleteRequest} 
                                        onReject={handleRejectRequest}
                                        isAdmin={false}
                                        isViewer={true}
                                        getSignatureStatusDetails={getSignatureStatusDetails}
                                    />
                                </div>
                            )}
                        </div>
                    )}

                    {/* DETAIL AND SIGNATURE MODAL */}
                    {selectedRequest && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[1000] flex items-center justify-center p-4 overflow-y-auto">
                            <div className={`w-full max-w-2xl rounded-3xl border p-6 ${theme === 'dark' ? 'bg-[#14192d] border-slate-800 text-white' : 'bg-white border-slate-200 text-slate-800'}`}>
                                <div className="flex justify-between items-center mb-4 border-b border-slate-800/20 pb-3">
                                    <div>
                                        <span className="text-[10px] text-slate-500">رهگیری: {selectedRequest.reqId}</span>
                                        <h3 className="text-lg font-black text-indigo-400 mt-0.5">{selectedRequest.title}</h3>
                                    </div>
                                    <button onClick={() => setSelectedRequest(null)} className="text-xl">✖️</button>
                                </div>

                                <div className="space-y-4 max-h-[65vh] overflow-y-auto pr-1">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="p-3.5 rounded-2xl bg-slate-500/5 border border-slate-800/60">
                                            <span className="text-xs text-slate-400 block">مبلغ حواله</span>
                                            <strong className="text-lg text-emerald-400 font-bold">{Number(selectedRequest.amount).toLocaleString()} تومان</strong>
                                            <span className="text-[9px] text-slate-500 block mt-1">حروف: {numberToPersianWords(selectedRequest.amount)}</span>
                                        </div>
                                        <div className="p-3.5 rounded-2xl bg-slate-500/5 border border-slate-800/60">
                                            <span className="text-xs text-slate-400 block">مهلت انقضا</span>
                                            <strong className="text-sm font-bold">{selectedRequest.expiryDateShamsi || 'نامحدود'}</strong>
                                        </div>
                                    </div>

                                    <div>
                                        <span className="text-xs text-slate-400 block mb-1">شرح درخواست</span>
                                        <div className="p-3 rounded-xl bg-slate-500/5 border border-slate-800/30 text-sm leading-relaxed">{selectedRequest.description || 'توضیحی ارائه نشده است.'}</div>
                                    </div>

                                    {selectedRequest.fileUrl && (
                                        <div className="p-3 rounded-xl bg-indigo-500/5 border border-indigo-500/20 flex justify-between items-center">
                                            <span className="text-xs text-slate-300">📄 فایل فاکتور ضمیمه شده</span>
                                            <a href={selectedRequest.fileUrl} target="_blank" rel="noreferrer" className="text-xs bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-bold">📥 مشاهده / دانلود فاکتور</a>
                                        </div>
                                    )}

                                    <div className="space-y-2 pt-2 border-t border-slate-800/20">
                                        <span className="text-xs text-slate-400 block">وضعیت امضاها و تایید نهایی</span>
                                        
                                        <div className={`p-3 rounded-xl border text-sm font-bold ${
                                            selectedRequest.status === 'approved' ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400' : 'bg-amber-500/10 border-amber-500/20 text-amber-400'
                                        }`}>
                                            {selectedRequest.status === 'approved' ? '✅ حواله تأیید نهایی شده است (خزانه‌دار + رئیس/نائب رئیس امضا کرده‌اند)' : `⏳ در انتظار تکمیل امضاها (نیاز به: ${getSignatureStatusDetails(selectedRequest).needed})`}
                                        </div>

                                        <div className="grid grid-cols-3 gap-3">
                                            {['khaaneh', 'raees', 'naeb'].map(role => {
                                                const uName = signerRoles[role];
                                                const uObj = users.find(u => u.username === uName);
                                                const label = role === 'khaaneh' ? 'خزانه‌دار (الزامی)' : role === 'raees' ? 'رئیس' : 'نائب رئیس';
                                                const signed = selectedRequest.signatures.find(s => s.signer === uName);

                                                return (
                                                    <div key={role} className={`p-3 rounded-xl border text-center flex flex-col justify-between h-32 ${signed ? 'bg-emerald-500/5 border-emerald-500/20' : 'bg-slate-500/5 border-dashed border-slate-800/30'}`}>
                                                        <div>
                                                            <span className="text-[9px] text-slate-500 block">{label}</span>
                                                            <span className="text-xs font-bold block mt-0.5">{uObj?.displayName || uName}</span>
                                                        </div>
                                                        {signed ? (
                                                            <div className="flex flex-col items-center">
                                                                <img src={signed.dataUrl} className="h-10 object-contain filter invert opacity-90 dark:invert-0 bg-white/5 p-0.5 rounded"/>
                                                                <span className="text-[8px] text-emerald-400 mt-1">{new Date(signed.time).toLocaleDateString('fa-IR')}</span>
                                                            </div>
                                                        ) : <span className="text-[9px] text-slate-500 italic mb-2">در انتظار...</span>}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {/* PEN SIGNATURE CANVAS */}
                                    {currentUser && currentUser.role === 'signer' && 
                                     selectedRequest.status === 'pending' && 
                                     !selectedRequest.signatures.some(s => s.signer === currentUser.username) && (
                                        <div className="pt-3 border-t border-slate-800/20 space-y-2">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs text-indigo-400 font-bold">🖊️ بوم امضای دیجیتال شما</span>
                                                <button onClick={clearCanvas} className="text-[10px] text-rose-400">پاک کردن بوم 🧹</button>
                                            </div>
                                            <div className="border border-slate-800 rounded-xl overflow-hidden bg-white">
                                                <canvas 
                                                    ref={canvasRef}
                                                    onMouseDown={startDrawing}
                                                    onMouseMove={draw}
                                                    onMouseUp={stopDrawing}
                                                    onMouseLeave={stopDrawing}
                                                    onTouchStart={startDrawing}
                                                    onTouchMove={draw}
                                                    onTouchEnd={stopDrawing}
                                                    className="w-full h-36 bg-slate-50 cursor-crosshair touch-none"
                                                />
                                            </div>
                                            <button onClick={handleSubmitSignature} className="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-sm">✅ ثبت و تایید امضا</button>
                                        </div>
                                    )}

                                    {/* PDF GENERATION BUTTONS */}
                                    {selectedRequest.signatures.length >= 2 && (
                                        <div className="pt-3 border-t border-slate-800/20 flex items-center justify-between gap-3 flex-wrap">
                                            <span className="text-xs text-slate-400">📄 خروجی رسمی حواله مالی:</span>
                                            <div className="flex gap-2">
                                                <button onClick={() => handlePreviewPDF(selectedRequest)} className="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 border border-slate-700 text-slate-300">👁️ پیش‌نمایش PDF</button>
                                                {getSignatureStatusDetails(selectedRequest).isValid && (
                                                    <button onClick={() => handleDownloadPDF(selectedRequest)} className="px-3.5 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white">📥 دانلود PDF حواله</button>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* PROFILE MODAL */}
                    {profileModalOpen && (
                        <div className="fixed inset-0 bg-slate-950/80 z-[1000] flex items-center justify-center p-4">
                            <div className={`w-full max-w-md rounded-3xl border p-6 ${theme === 'dark' ? 'bg-[#14192d] border-slate-800' : 'bg-white border-slate-200 text-slate-800'}`}>
                                <h3 className="text-base font-black mb-4">👤 ویرایش مشخصات فردی</h3>
                                <form onSubmit={handleSaveProfile} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">نام کاربری</label>
                                        <input type="text" value={profileUname} onChange={e => setProfileUname(e.target.value)} className="w-full p-2.5 rounded-xl border bg-transparent text-sm"/>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">نام نمایشی (فارسی)</label>
                                        <input type="text" value={profileDname} onChange={e => setProfileDname(e.target.value)} className="w-full p-2.5 rounded-xl border bg-transparent text-sm"/>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">رمز عبور جدید (اختیاری)</label>
                                        <input type="password" value={profilePass} onChange={e => setProfilePass(e.target.value)} placeholder="خالی بگذارید تا تغییر نکند" className="w-full p-2.5 rounded-xl border bg-transparent text-sm"/>
                                    </div>
                                    <div className="flex gap-3 pt-2">
                                        <button type="button" onClick={() => setProfileModalOpen(false)} className="flex-1 py-2 rounded-xl border text-xs">انصراف</button>
                                        <button type="submit" className="flex-1 bg-indigo-600 text-white font-bold py-2 rounded-xl text-xs">ذخیره تغییرات</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* USER EDIT MODAL */}
                    {userEditModalOpen && userToEdit && (
                        <div className="fixed inset-0 bg-slate-950/80 z-[1000] flex items-center justify-center p-4">
                            <div className={`w-full max-w-md rounded-3xl border p-6 ${theme === 'dark' ? 'bg-[#14192d] border-slate-800' : 'bg-white border-slate-200 text-slate-800'}`}>
                                <h3 className="text-base font-black mb-4">👥 ویرایش کاربر: {userToEdit.username}</h3>
                                <form onSubmit={handleUpdateUser} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">نام کاربری</label>
                                        <input type="text" value={editUname} onChange={e => setEditUname(e.target.value)} className="w-full p-2.5 rounded-xl border bg-transparent text-sm"/>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">نام نمایشی</label>
                                        <input type="text" value={editDname} onChange={e => setEditDname(e.target.value)} className="w-full p-2.5 rounded-xl border bg-transparent text-sm"/>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">رمز عبور جدید</label>
                                        <input type="text" value={editPass} onChange={e => setEditPass(e.target.value)} className="w-full p-2.5 rounded-xl border bg-transparent text-sm"/>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">نقش</label>
                                        <select value={editRole} onChange={e => setEditRole(e.target.value)} className="w-full p-2.5 rounded-xl border bg-transparent text-sm">
                                            <option value="admin">مدیر سیستم (Admin)</option>
                                            <option value="requester">ثبت‌کننده (Requester)</option>
                                            <option value="signer">امضاکننده (Signer)</option>
                                            <option value="viewer">مشاهده‌گر (Viewer)</option>
                                        </select>
                                    </div>
                                    <div className="flex gap-3 pt-2">
                                        <button type="button" onClick={() => { setUserEditModalOpen(false); setUserToEdit(null); }} className="flex-1 py-2 rounded-xl border text-xs">انصراف</button>
                                        <button type="submit" className="flex-1 bg-indigo-600 text-white font-bold py-2 rounded-xl text-xs">ذخیره ویرایش</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // ===================== REQUEST LIST COMPONENT =====================
        function RequestsList({ requests, theme, onOpenDetail, onDelete, onReject, onReverseReject, isAdmin, isViewer = false, getSignatureStatusDetails }) {
            if (requests.length === 0) {
                return (
                    <div className="text-center py-10 text-slate-500 text-sm">
                        هیچ درخواستی در این بخش یافت نشد.
                    </div>
                );
            }

            return (
                <div className="space-y-3">
                    {requests.map(req => {
                        const locked = req.status === 'approved' || req.status === 'rejected' || req.status === 'expired';
                        
                        return (
                            <div key={req.reqId} className={`p-4 rounded-2xl border flex flex-col md:flex-row justify-between md:items-center gap-3 transition-all hover:bg-slate-500/5 ${
                                theme === 'dark' ? 'bg-slate-900/40 border-slate-800/80 text-white' : 'bg-slate-50 border-slate-200 text-slate-800'
                            }`}>
                                <div>
                                    <div className="flex items-center gap-2 flex-wrap">
                                        <strong className="text-sm font-extrabold">{req.title}</strong>
                                        <span className={`text-[9px] px-2 py-0.5 rounded-full font-bold border ${
                                            req.status === 'approved' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' :
                                            req.status === 'rejected' ? 'bg-rose-500/10 text-rose-400 border-rose-500/20' :
                                            'bg-amber-500/10 text-amber-400 border-amber-500/20'
                                        }`}>
                                            {req.status === 'approved' ? 'تأیید نهایی' : req.status === 'rejected' ? 'رد شده' : 'در انتظار امضا'}
                                        </span>
                                    </div>
                                    <div className="text-[10px] text-slate-400 mt-1 flex gap-3">
                                        <span>💰 {Number(req.amount).toLocaleString()} تومان</span>
                                        <span>✍️ {req.signatures.length} از ۳ امضا</span>
                                        {req.expiryDateShamsi && <span>📅 مهلت: {req.expiryDateShamsi}</span>}
                                    </div>
                                </div>

                                <div className="flex gap-2 self-end md:self-center">
                                    <button onClick={() => onOpenDetail(req)} className="text-xs bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-bold">مشاهده و جزئیات</button>
                                    {isAdmin && (
                                        <>
                                            {!locked && (
                                                <button onClick={() => onReject(req.reqId)} className="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1.5 rounded-lg font-bold">رد کردن ❌</button>
                                            )}
                                            <button onClick={() => onDelete(req)} className="text-xs bg-rose-500/10 text-rose-400 border border-rose-500/20 px-3 py-1.5 rounded-lg" title="حذف کامل و دائمی درخواست">🗑️</button>
                                        </>
                                    )}
                                    {!isAdmin && !isViewer && req.status === 'rejected' && onReverseReject && (
                                        <button onClick={() => onReverseReject(req.reqId)} className="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1.5 rounded-lg">🔄 فعال‌سازی مجدد</button>
                                    )}
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        }

        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
