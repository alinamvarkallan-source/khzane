        /* 1. ANIMATED BACKGROUND GRADIENT & BLOBS */

            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .bg-animated-mesh {
            background: linear-gradient(-45deg, #050515, #0d0b26, #140e36, #07061a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes floatBlob {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.15); }
            66% { transform: translate(-20px, 20px) scale(0.9); }

        .blob-glowing-indigo {
            animation: floatBlob 12s infinite ease-in-out;
            filter: blur(80px);

            animation: floatBlob 16s infinite ease-in-out 2s;

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;

        @keyframes zoomInSpring {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(15px);

            to {
                opacity: 1;
                transform: scale(1) translateY(0);

        .animate-glow-pulse {
            animation: glowPulse 3.5s infinite ease-in-out;

            left: -60%;

        @keyframes slideInLeftSplit {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideInRightSplit {
            from { transform: translateX(100%); opacity: 0; }

        .corner-bl { bottom: 12px; left: 12px; border-width: 0 0 3px 3px; }
        .corner-br { bottom: 12px; right: 12px; border-width: 0 3px 3px 0; }

        @keyframes scan {

            50% { top: 100%; }
            100% { top: 0%; }

        .scanline {
            position: absolute;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(to bottom, rgba(99, 102, 241, 0), rgba(99, 102, 241, 0.8) 50%, rgba(99, 102, 241, 0));
            animation: scan 5s linear infinite;
            z-index: 5;
            pointer-events: none;
        }

        /* Cyberpunk Input Underline */
        .cyber-input-wrap {
            position: relative;
        }
        .cyber-input-underline {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(to right, #6366f1, #a855f7);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        input:focus ~ .cyber-input-underline,
        textarea:focus ~ .cyber-input-underline,
        select:focus ~ .cyber-input-underline {
            width: 100%;
            left: 0;
            filter: drop-shadow(0 0 8px #a855f7);
        }

        /* 7. GLASS CARDS HOVER LIFT & STAGGERED LIST ANIMATIONS */
        .hover-lift-glow {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .hover-lift-glow:hover {
            transform: translateY(-4px) scale(1.015);
            box-shadow: 0 20px 40px -15px rgba(99, 102, 241, 0.35);
            border-color: rgba(99, 102, 241, 0.4) !important;
        }

        /* Circular glowing radar */
        @keyframes radarScan {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .radar-ring {
            position: absolute;
            border: 2px solid rgba(99, 102, 241, 0.4);
            border-radius: 50%;
            animation: radarScan 3s infinite linear;
        }
        .radar-ring-delayed {
            animation-delay: 1.5s;
        }
    </style>
</head>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SUPABASE_URL = 'https://ukygbmrvyunuqcwvmbve.supabase.co';

        // Initialize Supabase Client safely
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ===================== SELF-HEALING DATABASE OPERATIONS =====================
        const extractMissingColumn = (message) => {
            if (!message) return '';
            const supabaseStyle = message.match(/'(\w+)' column/i);
            if (supabaseStyle && supabaseStyle[1]) {
                const col = supabaseStyle[1];
                if (col !== 'of' && col !== 'requests') return col;
            }
            const pgStyle = message.match(/column\s+["']?(\w+)["']?/i);
            if (pgStyle && pgStyle[1]) {
                const col = pgStyle[1];
                if (col !== 'of') return col;
            }
            return '';
        };

        const safeInsertRequest = async (req) => {
            let payload = {
                reqId: req.reqId,
                title: req.title,
                amount: req.amount,
                description: req.description || '',
                requester: req.requester,
                signatures: req.signatures || [],
                status: req.status || 'pending',
                events: req.events || []
            };

            if (req.expiryDate) payload.expiryDate = req.expiryDate;
            if (req.expiryDateShamsi) payload.expiryDateShamsi = req.expiryDateShamsi;
            if (req.fileUrl) payload.fileUrl = req.fileUrl;
            if (req.filePath) payload.filePath = req.filePath;
            if (req.fileOriginalName) payload.fileOriginalName = req.fileOriginalName;
            if (req.fileType) payload.fileType = req.fileType;

            const triedLowercase = new Set();

            for (let attempt = 0; attempt < 20; attempt++) {
                const { error } = await supabase.from('requests').insert(payload);
                if (!error) return; // Success!

                if (error.message?.includes('Failed to fetch') || error.name === 'TypeError') {
                    throw new Error('Failed to fetch - مشکل اتصال به سرور (اینترنت یا فیلترشکن خود را بررسی کنید)');
                }

                const isColumnError = error.message?.includes('column') || error.message?.includes('schema cache') || error.message?.includes('Could not find');
                if (!isColumnError) throw error;

                const missingColumn = extractMissingColumn(error.message);
                if (missingColumn) {
                    const lowerColumn = missingColumn.toLowerCase();
                    if (payload[missingColumn] !== undefined && missingColumn !== lowerColumn && !triedLowercase.has(missingColumn)) {
                        payload[lowerColumn] = payload[missingColumn];
                        delete payload[missingColumn];
                        triedLowercase.add(missingColumn);
                    } else {
                        delete payload[missingColumn];
                        delete payload[lowerColumn];
                    }
                } else {
                    if (payload.filePath) { delete payload.filePath; delete payload.filepath; }
                    else if (payload.fileUrl) { delete payload.fileUrl; delete payload.fileurl; }
                    else if (payload.expiryDate) { delete payload.expiryDate; delete payload.expirydate; }
                    else if (payload.expiryDateShamsi) { delete payload.expiryDateShamsi; delete payload.expirydateshamsi; }
                    else break;
                }
            }

            // Last resort minimum insert
            const minPayload = {
                title: req.title,
                amount: req.amount,
                requester: req.requester
            };
            const { error: finalError } = await supabase.from('requests').insert(minPayload);
            if (finalError) throw finalError;
        };

        const safeUpdateRequest = async (reqId, camelUpdates) => {
            let payload = { ...camelUpdates };
            const triedLowercase = new Set();

            for (let attempt = 0; attempt < 20; attempt++) {
                let query = supabase.from('requests').update(payload);
                
                if (triedLowercase.has('reqId')) {
                    query = query.eq('reqid', reqId);
                } else {
                    query = query.eq('reqId', reqId);
                }

                const { error } = await query;
                if (!error) return; // Success!

                const isColumnError = error.message?.includes('column') || error.message?.includes('schema cache') || error.message?.includes('Could not find');
                if (!isColumnError) {
                    if (error.message?.includes('Failed to fetch') || error.name === 'TypeError') {
                        throw new Error('Failed to fetch - مشکل اتصال به سرور');
                    }
                    throw error;
                }

                const missingColumn = extractMissingColumn(error.message);
                if (missingColumn) {
                    const lowerColumn = missingColumn.toLowerCase();
                    if (payload[missingColumn] !== undefined && missingColumn !== lowerColumn && !triedLowercase.has(missingColumn)) {
                        payload[lowerColumn] = payload[missingColumn];
                        delete payload[missingColumn];
                        triedLowercase.add(missingColumn);
                    } else if (missingColumn === 'reqId') {
                        triedLowercase.add('reqId');
                    } else {
                        delete payload[missingColumn];
                        delete payload[lowerColumn];
                    }
                } else {
                    break;
                }
            }
        };

        const safeDeleteRequest = async (reqId) => {
            const { error: firstError } = await supabase.from('requests').delete().eq('reqId', reqId);
            if (!firstError) return;

            const isColumnError = firstError.message?.includes('column') || firstError.message?.includes('schema cache') || firstError.message?.includes('Could not find');
            if (isColumnError) {
                const { error: secondError } = await supabase.from('requests').delete().eq('reqid', reqId);
                if (secondError) throw secondError;
            } else {
                throw firstError;
            }
        };

        const safeInsertUser = async (user) => {
            const { error: firstError } = await supabase.from('users').insert(user);
            if (!firstError) return;

            const isColumnError = firstError.message?.includes('column') || firstError.message?.includes('schema cache') || firstError.message?.includes('Could not find');
            if (isColumnError) {
                const lowercaseUser = {
                    username: user.username,
                    password: user.password,
                    role: user.role,
                    displayname: user.displayName
                };
                const { error: secondError } = await supabase.from('users').insert(lowercaseUser);
                if (secondError) throw secondError;
            } else {
                throw firstError;
            }
        };

        const safeUpdateUser = async (username, camelUpdates) => {
            const { error: firstError } = await supabase.from('users').update(camelUpdates).eq('username', username);
            if (!firstError) return;

            const isColumnError = firstError.message?.includes('column') || firstError.message?.includes('schema cache') || firstError.message?.includes('Could not find');
            if (isColumnError) {
                const lowercaseUpdates = {};
                for (const key in camelUpdates) {
                    const lowerKey = key.toLowerCase();
                    lowercaseUpdates[lowerKey] = camelUpdates[key];
                }
                const { error: secondError } = await supabase.from('users').update(lowercaseUpdates).eq('username', username);
                if (secondError) throw secondError;
            } else {
                throw firstError;
            }
        };

        // ===================== MAIN APP COMPONENT =====================
        function App() {

            // Create Request Form States

            // Add User Form States
            const [addUname, setAddUname] = useState('');

            const [addPass, setAddPass] = useState('');

            // Profile Edit States

                    const { data: requestsData, error: requestsError } = await supabase.from('requests').select('*');
                    if (requestsError) throw requestsError;
                    
                    const normalizedRequests = (requestsData || []).map(r => {
                        let cleanDescription = r.description || '';
                        let extractedFileUrl = r.fileUrl !== undefined ? r.fileUrl : (r.fileurl !== undefined ? r.fileurl : r['fileUrl']);
                        let extractedFilePath = r.filePath !== undefined ? r.filePath : (r.filepath !== undefined ? r.filepath : r['filePath']);
                        let extractedFileName = r.fileOriginalName !== undefined ? r.fileOriginalName : (r.fileoriginalname !== undefined ? r.fileoriginalname : r['fileOriginalName']);
                        let extractedFileType = r.fileType !== undefined ? r.fileType : (r.filetype !== undefined ? r.filetype : r['fileType']);

                        if (!extractedFileUrl && cleanDescription.includes('__FILE_ATTACHMENT__:')) {
                            const parts = cleanDescription.split('\n\n__FILE_ATTACHMENT__:');
                            cleanDescription = parts[0];
                            if (parts[1]) {
                                const fileParts = parts[1].split('||');
                                if (fileParts.length >= 4) {
                                    extractedFileName = fileParts[0];
                                    extractedFileUrl = fileParts[1];
                                    extractedFilePath = fileParts[2];
                                    extractedFileType = fileParts[3];
                                }
                            }
                        }

                        return {
                            id: r.id,
                            reqId: r.reqId !== undefined ? r.reqId : (r.reqid !== undefined ? r.reqid : r['reqId'] || ''),
                            title: r.title,
                            amount: Number(r.amount),
                            description: cleanDescription,
                            expiryDate: r.expiryDate !== undefined ? r.expiryDate : (r.expirydate !== undefined ? r.expirydate : r['expiryDate']),
                            expiryDateShamsi: r.expiryDateShamsi !== undefined ? r.expiryDateShamsi : (r.expirydateshamsi !== undefined ? r.expirydateshamsi : r['expiryDateShamsi']),
                            requester: r.requester,
                            signatures: r.signatures || [],
                            status: r.status,
                            events: r.events || [],
                            fileUrl: extractedFileUrl || null,
                            filePath: extractedFilePath || null,
                            fileOriginalName: extractedFileName || null,
                            fileType: extractedFileType || null
                        };
                    });
                    
                    const now = new Date();
                    const updatedRequests = normalizedRequests.map(r => {
                        if (r.expiryDate && r.status === 'pending' && new Date(r.expiryDate) < now) {
                            return { ...r, status: 'expired' };
                        }
                        return r;
                    });

                    setRequests(updatedRequests);
                } catch (err) {
                    console.error(err);
                    showToast('خطا در بارگذاری داده‌ها از دیتابیس: ' + (err.message || JSON.stringify(err)), 'error');

            // Creating Request

            const handleFixSpelling = () => {

            const handleCreateRequest = async (e) => {

                }

                setLoading(true);
                try {
                    let expiryDate = null;
                    if (newExpiryShamsi.trim()) {
                        const parts = newExpiryShamsi.split('/');
                        if (parts.length === 3) {
                            const jYear = parseInt(parts[0]);
                            const jMonth = parseInt(parts[1]);
                            const jDay = parseInt(parts[2]);
                            let gYear, gMonth, gDay;
                            if (jMonth > 9) {
                                gYear = jYear + 621;
                                gMonth = jMonth - 9;
                                gDay = jDay;
                            } else {
                                gYear = jYear + 622;
                                gMonth = jMonth + 3;
                                gDay = jDay;
                            }
                            expiryDate = new Date(gYear, gMonth - 1, gDay).toISOString();
                        }
                    }

                    let fileUrl = null;
                    let filePath = null;
                    let fileOriginalName = null;
                    let fileType = null;

                    if (newFile) {

                    }

                    }

                } finally {

            };

            // Canvas Handlers
            const initCanvas = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * devicePixelRatio;
                canvas.height = rect.height * devicePixelRatio;
                ctx.scale(devicePixelRatio, devicePixelRatio);
                
                ctx.lineWidth = 3.5;
                ctx.strokeStyle = '#1e293b';
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            };

            useEffect(() => {
                if (selectedRequest) {
                    const hasSigned = selectedRequest.signatures.some(s => s.signer === currentUser?.username);
                    const isPending = selectedRequest.status === 'pending';
                    const isSigner = currentUser?.role === 'signer';
                    
                    if (isSigner && isPending && !hasSigned) {
                        setTimeout(initCanvas, 100);
                    }
                }
            }, [selectedRequest, currentUser]);

            const getCanvasMousePos = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                
                return {
                    x: (clientX - rect.left) * (canvas.width / (rect.width * devicePixelRatio)),
                    y: (clientY - rect.top) * (canvas.height / (rect.height * devicePixelRatio))
                };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                const pos = getCanvasMousePos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                const pos = getCanvasMousePos(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            const handleSubmitSignature = async () => {
                const canvas = canvasRef.current;
                if (!canvas || !selectedRequest || !currentUser) return;
                
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                const buffer = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let isEmpty = true;
                for (let i = 0; i < buffer.data.length; i += 4) {
                    if (buffer.data[i + 3] > 0) {
                        isEmpty = false;
                        break;
                    }
                }

                if (isEmpty) {
                    showToast('لطفاً ابتدا روی بوم امضا را ترسیم کنید.', 'warning');
                    return;
                }

                const dataUrl = canvas.toDataURL('image/png');
                setLoading(true);

                try {
                    const updatedSignatures = [...(selectedRequest.signatures || [])];
                    updatedSignatures.push({
                        signer: currentUser.username,
                        displayName: currentUser.displayName || currentUser.username,
                        time: new Date().toISOString(),
                        dataUrl
                    });

                    const hasKhaaneh = updatedSignatures.some(s => signerRoles.khaaneh === s.signer);
                    const hasRaees = updatedSignatures.some(s => signerRoles.raees === s.signer);
                    const hasNaeb = updatedSignatures.some(s => signerRoles.naeb === s.signer);

                    let newStatus = selectedRequest.status;
                    if (hasKhaaneh && (hasRaees || hasNaeb) && updatedSignatures.length >= 2) {
                        newStatus = 'approved';
                    }

                    const updatedEvents = [...(selectedRequest.events || [])];
                    updatedEvents.push({
                        time: new Date().toISOString(),
                        action: `امضا توسط ${currentUser.displayName || currentUser.username} (${getRoleLabel(currentUser.username)})`
                    });

                    if (newStatus === 'approved') {
                        updatedEvents.push({
                            time: new Date().toISOString(),

                        });
                    }

                    await safeUpdateRequest(selectedRequest.reqId, {
                        signatures: updatedSignatures,
                        status: newStatus,
                        events: updatedEvents
                    });

                    showToast(
                        newStatus === 'approved' 
                            ? 'درخواست به دلیل تکمیل امضاها با موفقیت تأیید نهایی شد!' 
                            : 'امضای شما با موفقیت ثبت گردید.', 
                        'success'
                    );

                    const updatedReq = {
                        ...selectedRequest,
                        signatures: updatedSignatures,
                        status: newStatus,
                        events: updatedEvents
                    };
                    setSelectedRequest(updatedReq);
                    fetchData();
                } catch (err) {
                    console.error(err);
                    showToast('خطا در ثبت امضا: ' + (err.message || JSON.stringify(err)), 'error');
                } finally {
                    setLoading(false);
                }
            };

            // Number to Words Converter
            const numberToPersianWords = (num) => {
                if (num === 0) return 'صفر';
                
                const yekan = ['', 'یک', 'دو', 'سه', 'چهار', 'پنج', 'شش', 'هفت', 'هشت', 'نه'];
                const dahgan = ['', 'ده', 'بیست', 'سی', 'چهل', 'پنجاه', 'شصت', 'هفتاد', 'هشتاد', 'نود'];
                const dah_ta_nuzdah = ['ده', 'یازده', 'دوازده', 'سیزده', 'چهارده', 'پانزده', 'شانزده', 'هفده', 'هجده', 'نوزده'];
                const sadgan = ['', 'صد', 'doyest', 'سیصد', 'چهارصد', 'پانصد', 'ششصد', 'هفتصد', 'هشتصد', 'نهصد'];
                const tables = ['', 'هزار', 'میلیون', 'میلیارد', 'تریلیون'];
                
                const convertThreeDigits = (n) => {
                    if (n === 0) return '';
                    let res = [];
                    
                    const s = Math.floor(n / 100);
                    const d = Math.floor((n % 100) / 10);
                    const y = n % 10;
                    
                    if (s > 0) {
                        if (s === 2) res.push('دویست');
                        else res.push(sadgan[s]);
                    }
                    
                    if (d === 1) {
                        res.push(dah_ta_nuzdah[y]);
                    } else {
                        if (d > 0) res.push(dahgan[d]);
                        if (y > 0) res.push(yekan[y]);
                    }
                    
                    return res.join(' و ');
                };
                
                let parts = [];
                let temp = num;
                let unitIdx = 0;
                
                while (temp > 0) {
                    const chunk = temp % 1000;
                    if (chunk > 0) {
                        const chunkStr = convertThreeDigits(chunk);
                        const unit = tables[unitIdx];
                        parts.unshift(chunkStr + (unit ? ' ' + unit : ''));
                    }
                    temp = Math.floor(temp / 1000);
                    unitIdx++;
                }
                
                return parts.join(' و ') + ' تومان';
            };

            // PDF Generation helpers
            const textToCanvasURL = (text, fontSize, color = '#1e293b', maxWidth) => {
                const c = document.createElement('canvas');
                const ctx2 = c.getContext('2d');
                if (!ctx2) return { dataUrl: '', width: 100, height: 10 };
                
                ctx2.font = `${fontSize}px Vazirmatn, Tahoma, sans-serif`;
                const metrics = ctx2.measureText(text);
                const padding = 20;
                const width = Math.min(metrics.width + padding, maxWidth || 1000);
                const height = fontSize * 1.8;
                
                c.width = width * 2;
                c.height = height * 2;
                
                ctx2.scale(2, 2);
                ctx2.font = `${fontSize}px Vazirmatn, Tahoma, sans-serif`;
                ctx2.fillStyle = color;
                ctx2.textAlign = 'right';
                ctx2.textBaseline = 'middle';
                ctx2.fillText(text, width - 10, height / 2);
                
                return {
                    dataUrl: c.toDataURL('image/png'),
                    width: width,
                    height: height
                };
            };

            const textLinesToCanvasURL = (text, fontSize, color = '#334155', maxWidth = 600) => {
                const c = document.createElement('canvas');
                const ctx2 = c.getContext('2d');
                if (!ctx2) return { dataUrl: '', width: maxWidth, height: 20 };
                
                ctx2.font = `${fontSize}px Vazirmatn, Tahoma, sans-serif`;
                
                const lines = [];
                const words = text.split(' ');
                const maxLineWidth = maxWidth - 20;
                let currentLine = '';
                
                for (let word of words) {
                    const testLine = currentLine ? currentLine + ' ' + word : word;
                    if (ctx2.measureText(testLine).width > maxLineWidth && currentLine) {
                        lines.push(currentLine);
                        currentLine = word;
                    } else {
                        currentLine = testLine;
                    }
                }
                if (currentLine) lines.push(currentLine);
                
                const lineHeight = fontSize * 1.6;
                const height = lineHeight * lines.length + 15;
                
                c.width = maxWidth * 2;
                c.height = height * 2;
                
                ctx2.scale(2, 2);
                ctx2.font = `${fontSize}px Vazirmatn, Tahoma, sans-serif`;
                ctx2.fillStyle = color;
                ctx2.textAlign = 'right';
                
                lines.forEach((line, i) => {
                    ctx2.fillText(line, maxWidth - 10, (i + 0.8) * lineHeight);
                });
                
                return {
                    dataUrl: c.toDataURL('image/png'),
                    width: maxWidth,
                    height: height
                };
            };

            const buildPDFDoc = async (req) => {

                doc.line(15, 36, 195, 36);

                    doc.addImage(expiryObj.dataUrl, 'PNG', 115, 64 + reqTitlePdfHeight + reqAmountPdfHeight + detailsHeaderPdfHeight + descPdfHeight, expiryPdfWidth, expiryPdfHeight);

                const khaanehSig = req.signatures.find(s => signerRoles.khaaneh === s.signer);

                const slots = [
                    {

                        y: sigStartY + sigTitlePdfHeight + 6,

                    {

                        y: sigStartY + sigTitlePdfHeight + 6,

                const loadImageToPDF = (url) => {
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.crossOrigin = 'anonymous';
                        img.onload = () => resolve(img);
                        img.onerror = () => resolve(img);
                        img.src = url;
                    });
                };

                for (let slot of slots) {
                    doc.setFillColor(255, 255, 255);
                    doc.setDrawColor(203, 213, 225);
                    doc.setLineWidth(0.3);
                    doc.roundedRect(slot.x, slot.y, 54, 42, 2, 2, 'FD');

                    const rLabelObj = textToCanvasURL(slot.roleName, 10.5, '#475569', 200);
                    const rLabelPdfWidth = 40;

                    const rx = slot.x + (54 - rLabelPdfWidth) / 2 + 3;
                    doc.addImage(rLabelObj.dataUrl, 'PNG', rx, slot.y + 3, rLabelPdfWidth, rLabelPdfHeight);

                    const uLabelObj = textToCanvasURL(slot.userName, 9.5, '#64748b', 200);
                    const uLabelPdfWidth = 35;
                    const uLabelPdfHeight = (uLabelObj.height / uLabelObj.width) * uLabelPdfWidth;
                    const ux = slot.x + (54 - uLabelPdfWidth) / 2 + 2.5;
                    doc.addImage(uLabelObj.dataUrl, 'PNG', ux, slot.y + 8, uLabelPdfWidth, uLabelPdfHeight);

                    doc.setDrawColor(226, 232, 240);
                    doc.rect(slot.x + 4, slot.y + 14, 46, 20);

                    if (slot.sig && slot.sig.dataUrl) {
                        try {
                            const img = await loadImageToPDF(slot.sig.dataUrl);

                        doc.addImage(timeObj.dataUrl, 'PNG', tx, slot.y + 35, timePdfWidth, timePdfHeight);
                    } else {

                        const waitPdfHeight = (waitObj.height / waitObj.width) * waitPdfWidth;

                        doc.addImage(waitObj.dataUrl, 'PNG', wx, slot.y + 22, waitPdfWidth, waitPdfHeight);

                const footerTextObj = textToCanvasURL('سامانه هوشمند مدیریت خزانه و حوالجات مالی - امنیت تضمین‌شده با فناوری Supabase', 9, '#94a3b8', 600);

            const handlePreviewPDF = async (req) => {

                };
            };

            // ===================== JSX RENDERING =====================
            if (showPreloader) {
                return (
                    <div className="fixed inset-0 bg-[#040310] z-[99999] flex flex-col items-center justify-center p-6 select-none">

                            <div className="absolute inset-6 rounded-full border border-cyan-500/10 border-l-cyan-400 animate-spin-slow"></div>
                            
                            {/* Central glowing icon */}
                            <div className="h-28 w-28 rounded-3xl bg-gradient-to-br from-indigo-500 to-purple-600 flex flex-col items-center justify-center shadow-[0_0_60px_rgba(99,102,241,0.6)] border border-indigo-400/30 animate-pulse-logo z-10">
                                <span className="text-5xl">🏦</span>

                        {/* Interactive Loading and Percentage */}
                        <div className="text-center space-y-4 z-10 max-w-md">

                            {/* Loading Bar and Percentage */}
                            <div className="space-y-2">
                                <div className="flex items-center justify-between text-[11px] text-slate-500 font-bold px-2">
