<body class="bg-[#0a0a1a] text-slate-100 transition-colors duration-300">

    <!-- React Root Container -->
    <div id="root"></div>

    <!-- React App Script with Babel -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ===================== SUPABASE CONFIG =====================
        const SUPABASE_URL = 'https://ukygbmrvyunuqcwvmbve.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_bWoClqM3Mji6eTLuACFtMw_agp5gEph';
        
        // Initialize Supabase Client safely
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ===================== SELF-HEALING DATABASE OPERATIONS =====================
        const extractMissingColumn = (message) => {
            if (!message) return '';
            const supabaseStyle = message.match(/'(\w+)' column/i);
            if (supabaseStyle && supabaseStyle[1]) {
                const col = supabaseStyle[1];
                if (col !== 'of' && col !== 'requests') return col;
            }
            const pgStyle = message.match(/column\s+["']?(\w+)["']?/i);
            if (pgStyle && pgStyle[1]) {
                const col = pgStyle[1];
                if (col !== 'of') return col;
            }
            return '';
        };

        const safeInsertRequest = async (req) => {
            // Strategy A: CamelCase
            let camelPayload = {
                reqId: req.reqId,
                title: req.title,
                amount: req.amount,
                description: req.description || '',
                requester: req.requester,
                signatures: req.signatures || [],
                status: req.status || 'pending',
                events: req.events || []
            };

            if (req.expiryDate) camelPayload.expiryDate = req.expiryDate;
            if (req.expiryDateShamsi) camelPayload.expiryDateShamsi = req.expiryDateShamsi;
            if (req.fileUrl) camelPayload.fileUrl = req.fileUrl;
            if (req.filePath) camelPayload.filePath = req.filePath;
            if (req.fileOriginalName) camelPayload.fileOriginalName = req.fileOriginalName;
            if (req.fileType) camelPayload.fileType = req.fileType;

            for (let attempt = 0; attempt < 15; attempt++) {
                const { error } = await supabase.from('requests').insert(camelPayload);
                if (!error) return;

                if (error.message?.includes('Failed to fetch') || error.name === 'TypeError') {
                    throw new Error('Failed to fetch - مشکل اتصال به سرور (اینترنت یا فیلترشکن خود را بررسی کنید)');
                }

                const isColumnError = error.message?.includes('column') || error.message?.includes('schema cache') || error.message?.includes('Could not find');
                if (!isColumnError) throw error;

                const missingColumn = extractMissingColumn(error.message);
                if (missingColumn) {
                    if (missingColumn === 'reqId') break; // Switch to Strategy B
                    delete camelPayload[missingColumn];
                } else {
                    if (camelPayload.filePath) delete camelPayload.filePath;
                    else if (camelPayload.fileUrl) delete camelPayload.fileUrl;
                    else if (camelPayload.expiryDate) delete camelPayload.expiryDate;
                    else if (camelPayload.expiryDateShamsi) delete camelPayload.expiryDateShamsi;
                    else if (camelPayload.fileOriginalName) delete camelPayload.fileOriginalName;
                    else if (camelPayload.fileType) delete camelPayload.fileType;
                    else break;
                }
            }

            // Strategy B: Lowercase
            let lowerPayload = {
                reqid: req.reqId,
                title: req.title,
                amount: req.amount,
                description: req.description || '',
                requester: req.requester,
                signatures: req.signatures || [],
                status: req.status || 'pending',
                events: req.events || []
            };

            if (req.expiryDate) lowerPayload.expirydate = req.expiryDate;
            if (req.expiryDateShamsi) lowerPayload.expirydateshamsi = req.expiryDateShamsi;
            if (req.fileUrl) lowerPayload.fileurl = req.fileUrl;
            if (req.filePath) lowerPayload.filepath = req.filePath;
            if (req.fileOriginalName) lowerPayload.fileoriginalname = req.fileOriginalName;
            if (req.fileType) lowerPayload.filetype = req.fileType;

            for (let attempt = 0; attempt < 15; attempt++) {
                const { error } = await supabase.from('requests').insert(lowerPayload);
                if (!error) return;

                if (error.message?.includes('Failed to fetch') || error.name === 'TypeError') {
                    throw new Error('Failed to fetch - مشکل اتصال به سرور (اینترنت یا فیلترشکن خود را بررسی کنید)');
                }

                const isColumnError = error.message?.includes('column') || error.message?.includes('schema cache') || error.message?.includes('Could not find');
                if (!isColumnError) throw error;

                const missingColumn = extractMissingColumn(error.message);
                if (missingColumn) {
                    delete lowerPayload[missingColumn];
                } else {
                    if (lowerPayload.filepath) delete lowerPayload.filepath;
                    else if (lowerPayload.fileurl) delete lowerPayload.fileurl;
                    else if (lowerPayload.expirydate) delete lowerPayload.expirydate;
                    else if (lowerPayload.expirydateshamsi) delete lowerPayload.expirydateshamsi;
                    else if (lowerPayload.fileoriginalname) delete lowerPayload.fileoriginalname;
                    else if (lowerPayload.filetype) delete lowerPayload.filetype;
                    else break;
                }
            }

            // Strategy C: Absolute Minimum
            const minPayload = {
                title: req.title,
                amount: req.amount,
                requester: req.requester
            };
            const { error: finalError } = await supabase.from('requests').insert(minPayload);
            if (finalError) throw finalError;
        };

        const safeUpdateRequest = async (reqId, camelUpdates) => {
            let { error } = await supabase.from('requests').update(camelUpdates).eq('reqId', reqId);
            if (!error) return;

            const isColumnError = error.message?.includes('column') || error.message?.includes('schema cache') || error.message?.includes('Could not find');
            if (!isColumnError) {
                if (error.message?.includes('Failed to fetch') || error.name === 'TypeError') {
                    throw new Error('Failed to fetch - مشکل اتصال به سرور Supabase');
                }
                throw error;
            }

            const lowercaseUpdates = {};
            for (const key in camelUpdates) {
                const lowerKey = key.toLowerCase();
                lowercaseUpdates[lowerKey] = camelUpdates[key];
            }

            const { error: secondError } = await supabase
                .from('requests')
                .update(lowercaseUpdates)
                .eq('reqid', reqId);

            if (!secondError) return;

            if (secondError.message?.includes('column') || secondError.message?.includes('schema cache')) {
                const safeUpdates = {};
                ['status', 'signatures', 'events'].forEach(k => {
                    if (camelUpdates[k] !== undefined) safeUpdates[k] = camelUpdates[k];
                });

                if (Object.keys(safeUpdates).length > 0) {
                    const { error: safeErr } = await supabase.from('requests').update(safeUpdates).eq('reqid', reqId);
                    if (safeErr) throw safeErr;
                    return;
                }
            }

            throw secondError;
        };

        const safeDeleteRequest = async (reqId) => {
            const { error: firstError } = await supabase.from('requests').delete().eq('reqId', reqId);
            if (!firstError) return;

            const isColumnError = firstError.message?.includes('column') || firstError.message?.includes('schema cache') || firstError.message?.includes('Could not find');
            if (isColumnError) {
                const { error: secondError } = await supabase.from('requests').delete().eq('reqid', reqId);
                if (secondError) throw secondError;
            } else {
                throw firstError;
            }
        };

        const safeInsertUser = async (user) => {
            const { error: firstError } = await supabase.from('users').insert(user);
            if (!firstError) return;

            const isColumnError = firstError.message?.includes('column') || firstError.message?.includes('schema cache') || firstError.message?.includes('Could not find');
            if (isColumnError) {
                const lowercaseUser = {
                    username: user.username,
                    password: user.password,
                    role: user.role,
                    displayname: user.displayName
                };
                const { error: secondError } = await supabase.from('users').insert(lowercaseUser);
                if (secondError) throw secondError;
            } else {
                throw firstError;
            }
        };

        const safeUpdateUser = async (username, camelUpdates) => {
            const { error: firstError } = await supabase.from('users').update(camelUpdates).eq('username', username);
            if (!firstError) return;

            const isColumnError = firstError.message?.includes('column') || firstError.message?.includes('schema cache') || firstError.message?.includes('Could not find');
            if (isColumnError) {
                const lowercaseUpdates = {};
                for (const key in camelUpdates) {
                    const lowerKey = key.toLowerCase();
                    lowercaseUpdates[lowerKey] = camelUpdates[key];
                }
                const { error: secondError } = await supabase.from('users').update(lowercaseUpdates).eq('username', username);
                if (secondError) throw secondError;
            } else {
                throw firstError;
            }
        };

        // ===================== MAIN APP COMPONENT =====================
        function App() {
            const [currentUser, setCurrentUser] = useState(null);
            const [users, setUsers] = useState([]);
            const [requests, setRequests] = useState([]);
            const [signerRoles, setSignerRoles] = useState({
                raees: 'signer1',
                khaaneh: 'signer2',
                naeb: 'signer3'
            });

            // UI States
            const [theme, setTheme] = useState('dark');
            const [loginUsername, setLoginUsername] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            const [loading, setLoading] = useState(false);
            const [dbLoading, setDbLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('requests');
            const [toasts, setToasts] = useState([]);

            // Modals
            const [selectedRequest, setSelectedRequest] = useState(null);
            const [profileModalOpen, setProfileModalOpen] = useState(false);
            const [userEditModalOpen, setUserEditModalOpen] = useState(false);
            const [userToEdit, setUserToEdit] = useState(null);
            
            // Create Request Form States
            const [newTitle, setNewTitle] = useState('');
            const [newAmount, setNewAmount] = useState('');
            const [newDesc, setNewDesc] = useState('');
            const [newExpiryShamsi, setNewExpiryShamsi] = useState('');
            const [newFile, setNewFile] = useState(null);
            const [spellCheckMsg, setSpellCheckMsg] = useState(null);
            const [uploadingFile, setUploadingFile] = useState(false);

            // Edit User Form States
            const [editUname, setEditUname] = useState('');
            const [editDname, setEditDname] = useState('');
            const [editPass, setEditPass] = useState('');
            const [editRole, setEditRole] = useState('signer');

            // Add User Form States
            const [addUname, setAddUname] = useState('');
            const [addDname, setAddDname] = useState('');
            const [addPass, setAddPass] = useState('');
            const [addRole, setAddRole] = useState('signer');

            // Profile Edit States
            const [profileUname, setProfileUname] = useState('');
            const [profileDname, setProfileDname] = useState('');
            const [profilePass, setProfilePass] = useState('');

            // Canvas Drawing
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            // Initialize
            useEffect(() => {
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme === 'light') {
                    setTheme('light');
                    document.body.classList.remove('bg-[#0a0a1a]', 'text-slate-100');
                    document.body.classList.add('bg-slate-50', 'text-slate-900', 'light');
                }

                const savedUserStr = localStorage.getItem('currentUser');
                if (savedUserStr) {
                    try {
                        const parsedUser = JSON.parse(savedUserStr);
                        setCurrentUser(parsedUser);
                        fetchData();
                    } catch (e) {
                        localStorage.removeItem('currentUser');
                    }
                }
            }, []);

            const showToast = (message, type = 'info') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 4000);
            };

            const toggleTheme = () => {
                if (theme === 'dark') {
                    setTheme('light');
                    localStorage.setItem('theme', 'light');
                    document.body.classList.remove('bg-[#0a0a1a]', 'text-slate-100');
                    document.body.classList.add('bg-slate-50', 'text-slate-900', 'light');
                } else {
                    setTheme('dark');
                    localStorage.setItem('theme', 'dark');
                    document.body.classList.remove('bg-slate-50', 'text-slate-900', 'light');
                    document.body.classList.add('bg-[#0a0a1a]', 'text-slate-100');
                }
            };

            // Data Fetching
            const fetchData = async () => {
                setDbLoading(true);
                try {
                    // Fetch users
                    const { data: usersData, error: usersError } = await supabase.from('users').select('*');
                    if (usersError) throw usersError;
                    
                    const normalizedUsers = (usersData || []).map(u => ({
                        id: u.id,
                        username: u.username,
                        password: u.password,
                        role: u.role,
                        displayName: u.displayName !== undefined ? u.displayName : (u.displayname !== undefined ? u.displayname : u.username)
                    }));
                    setUsers(normalizedUsers);

                    // Fetch signer roles
                    const { data: settingsData, error: settingsError } = await supabase
                        .from('settings')
                        .select('value')
                        .eq('key', 'signerRoles')
                        .single();
                    
                    if (!settingsError && settingsData) {
                        setSignerRoles(settingsData.value);
                    }

                    // Fetch requests
                    const { data: requestsData, error: requestsError } = await supabase.from('requests').select('*');
                    if (requestsError) throw requestsError;
                    
                    const normalizedRequests = (requestsData || []).map(r => ({
                        id: r.id,
                        reqId: r.reqId !== undefined ? r.reqId : (r.reqid !== undefined ? r.reqid : r['reqId'] || ''),
                        title: r.title,
                        amount: Number(r.amount),
                        description: r.description,
                        expiryDate: r.expiryDate !== undefined ? r.expiryDate : (r.expirydate !== undefined ? r.expirydate : r['expiryDate']),
                        expiryDateShamsi: r.expiryDateShamsi !== undefined ? r.expiryDateShamsi : (r.expirydateshamsi !== undefined ? r.expirydateshamsi : r['expiryDateShamsi']),
                        requester: r.requester,
                        signatures: r.signatures || [],
                        status: r.status,
                        events: r.events || [],
                        fileUrl: r.fileUrl !== undefined ? r.fileUrl : (r.fileurl !== undefined ? r.fileurl : r['fileUrl']),
                        filePath: r.filePath !== undefined ? r.filePath : (r.filepath !== undefined ? r.filepath : r['filePath']),
                        fileOriginalName: r.fileOriginalName !== undefined ? r.fileOriginalName : (r.fileoriginalname !== undefined ? r.fileoriginalname : r['fileOriginalName']),
                        fileType: r.fileType !== undefined ? r.fileType : (r.filetype !== undefined ? r.filetype : r['fileType'])
                    }));
                    
                    const now = new Date();
                    const updatedRequests = normalizedRequests.map(r => {
                        if (r.expiryDate && r.status === 'pending' && new Date(r.expiryDate) < now) {
                            return { ...r, status: 'expired' };
                        }
                        return r;
                    });

                    setRequests(updatedRequests);
                } catch (err) {
                    console.error(err);
                    showToast('خطا در بارگذاری داده‌ها از دیتابیس: ' + (err.message || JSON.stringify(err)), 'error');
                } finally {
                    setDbLoading(false);
                }
            };

            // Authentication
            const handleLogin = async (e) => {
                e.preventDefault();
                if (!loginUsername.trim() || !loginPassword) {
                    setLoginError('لطفاً نام کاربری و رمز عبور را وارد کنید.');
                    return;
                }

                setLoading(true);
                setLoginError('');
                try {
                    const { data: usersData, error } = await supabase.from('users').select('*');
                    if (error) throw error;

                    const user = (usersData || []).find(u => u.username === loginUsername.trim());
                    if (!user) {
                        setLoginError('نام کاربری یافت نشد.');
                        return;
                    }

                    if (user.password !== loginPassword) {
                        setLoginError('رمز عبور اشتباه است.');
                        return;
                    }

                    setCurrentUser(user);
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    showToast(`خوش آمدید، ${user.displayName || user.username}`, 'success');
                    fetchData();
                } catch (err) {
                    console.error(err);
                    setLoginError('خطا در اتصال به پایگاه داده Supabase.');
                } finally {
                    setLoading(false);
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                localStorage.removeItem('currentUser');
                showToast('با موفقیت از سامانه خارج شدید.', 'info');
            };

            const getRoleLabel = (username) => {
                if (signerRoles.raees === username) return 'رئیس هیئت مدیره';
                if (signerRoles.khaaneh === username) return 'خزانه‌دار';
                if (signerRoles.naeb === username) return 'نائب رئیس';
                return 'امضاکننده عادی';
            };

            const getRoleBadgeClass = (username) => {
                if (signerRoles.raees === username) return 'bg-purple-500/10 text-purple-400 border border-purple-500/20';
                if (signerRoles.khaaneh === username) return 'bg-amber-500/10 text-amber-400 border border-amber-500/20';
                if (signerRoles.naeb === username) return 'bg-blue-500/10 text-blue-400 border border-blue-500/20';
                return 'bg-slate-500/10 text-slate-400 border border-slate-500/20';
            };

            // Admin User Management
            const handleAddUser = async (e) => {
                e.preventDefault();
                if (!addUname.trim() || !addPass.trim()) {
                    showToast('نام کاربری و رمز عبور الزامی است.', 'warning');
                    return;
                }

                if (users.some(u => u.username === addUname.trim())) {
                    showToast('این نام کاربری قبلاً ثبت شده است.', 'error');
                    return;
                }

                setLoading(true);
                try {
                    const newUser = {
                        username: addUname.trim(),
                        password: addPass.trim(),
                        role: addRole,
                        displayName: addDname.trim() || addUname.trim()
                    };

                    await safeInsertUser(newUser);
                    showToast('کاربر جدید با موفقیت اضافه شد.', 'success');
                    setAddUname('');
                    setAddDname('');
                    setAddPass('');
                    setAddRole('signer');
                    fetchData();
                } catch (err) {
                    console.error(err);
                    showToast('خطا در ثبت کاربر جدید: ' + (err.message || JSON.stringify(err)), 'error');
                } finally {
                    setLoading(false);
                }
            };

            const openEditUserModal = (user) => {
                setUserToEdit(user);
                setEditUname(user.username);
                setEditDname(user.displayName || '');
                setEditPass(user.password || '');
                setEditRole(user.role);
                setUserEditModalOpen(true);
            };

            const handleUpdateUser = async (e) => {
                e.preventDefault();
                if (!userToEdit) return;

                if (!editUname.trim()) {
                    showToast('نام کاربری نمی‌تواند خالی باشد.', 'warning');
                    return;
                }

                setLoading(true);
                try {
                    const updates = {
                        username: editUname.trim(),
                        displayName: editDname.trim() || editUname.trim(),
                        role: editRole
                    };
                    if (editPass) updates.password = editPass;

                    await safeUpdateUser(userToEdit.username, updates);

                    if (editUname.trim() !== userToEdit.username) {
                        const roles = { ...signerRoles };
                        let rolesChanged = false;
                        if (roles.raees === userToEdit.username) { roles.raees = editUname.trim(); rolesChanged = true; }
                        if (roles.khaaneh === userToEdit.username) { roles.khaaneh = editUname.trim(); rolesChanged = true; }
                        if (roles.naeb === userToEdit.username) { roles.naeb = editUname.trim(); rolesChanged = true; }
                        
                        if (rolesChanged) {
                            await supabase.from('settings').upsert({ key: 'signerRoles', value: roles }, { onConflict: 'key' });
                            setSignerRoles(roles);
                        }
                    }

                    showToast('کاربر با موفقیت ویرایش شد.', 'success');
                    setUserEditModalOpen(false);
                    setUserToEdit(null);
                    fetchData();
                } catch (err) {
                    console.error(err);
                    showToast('خطا در ویرایش کاربر: ' + (err.message || JSON.stringify(err)), 'error');
                } finally {
                    setLoading(false);
                }
            };

            const handleSaveSignerRoles = async () => {
                setLoading(true);
                try {
                    const { error } = await supabase
                        .from('settings')
                        .upsert({ key: 'signerRoles', value: signerRoles }, { onConflict: 'key' });
                    
                    if (error) throw error;
                    showToast('نقش‌های امضاکنندگان با موفقیت ذخیره شد.', 'success');
                } catch (err) {
                    console.error(err);
                    showToast('خطا در ذخیره نقش‌ها: ' + (err.message || JSON.stringify(err)), 'error');
                } finally {
                    setLoading(false);
                }
            };

            // Profile Edit
            const openProfileModal = () => {
                if (!currentUser) return;
                setProfileUname(currentUser.username);
                setProfileDname(currentUser.displayName || '');
                setProfilePass('');
                setProfileModalOpen(true);
            };

            const handleSaveProfile = async (e) => {
                e.preventDefault();
                if (!currentUser) return;

                if (!profileUname.trim()) {
                    showToast('نام کاربری نمی‌تواند خالی باشد.', 'warning');
                    return;
                }

                setLoading(true);
                try {
                    const updates = {
                        username: profileUname.trim(),
                        displayName: profileDname.trim() || profileUname.trim()
                    };
                    if (profilePass) updates.password = profilePass;

                    await safeUpdateUser(currentUser.username, updates);

                    const updatedUser = {
                        ...currentUser,
                        username: profileUname.trim(),
                        displayName: profileDname.trim() || profileUname.trim()
                    };
                    if (profilePass) updatedUser.password = profilePass;

                    setCurrentUser(updatedUser);
                    localStorage.setItem('currentUser', JSON.stringify(updatedUser));
                    showToast('پروفایل شما با موفقیت بروزرسانی شد.', 'success');
                    setProfileModalOpen(false);
                    fetchData();
                } catch (err) {
                    console.error(err);
                    showToast('خطا در بروزرسانی پروفایل: ' + (err.message || JSON.stringify(err)), 'error');
                } finally {
                    setLoading(false);
                }
            };

            // File Upload
            const uploadFileToStorage = async (file) => {
                const fileExt = file.name.split('.').pop();
                const filePath = `${Date.now()}_${Math.random().toString(36).substring(2, 11)}.${fileExt}`;
                
                const { error } = await supabase.storage
                    .from('attachments')
                    .upload(filePath, file, { cacheControl: '3600', upsert: false });

                if (error) throw error;

                const { data: publicUrl } = supabase.storage.from('attachments').getPublicUrl(filePath);
                return { url: publicUrl.publicUrl, filePath };
            };

            const deleteFileFromStorage = async (filePath) => {
                const { error } = await supabase.storage.from('attachments').remove([filePath]);
                if (error) console.error('Error deleting file:', error);
            };

            // Creating Request
            const handleCheckSpelling = () => {
                if (!newDesc.trim()) {
                    showToast('ابتدا متنی برای بررسی وارد کنید.', 'info');
                    return;
                }
                
                const containsArabicChars = /[\u064A\u066B\u0643\u066C]/.test(newDesc);
                if (containsArabicChars) {
                    setSpellCheckMsg({
                        text: 'متن شما حاوی نویسه‌های عربی "ی" یا "ک" است. برای هماهنگی و زیبایی سیستم، پیشنهاد می‌شود آن‌ها را به فارسی تبدیل کنید.',
                        type: 'warning'
                    });
                    showToast('نویسه‌های غیرفارسی شناسایی شدند!', 'warning');
                } else {
                    setSpellCheckMsg({
                        text: 'تبریک! تمام حروف متن فارسی استاندارد هستند.',
                        type: 'success'
                    });
                    showToast('متن فارسی سالم است.', 'success');
                }
            };

            const handleFixSpelling = () => {
                let fixed = newDesc
                    .replace(/\u064A/g, '\u06CC')
                    .replace(/\u0643/g, '\u06A9');
                
                setNewDesc(fixed);
                setSpellCheckMsg({
                    text: 'متن شما با موفقیت اصلاح شد و حروف عربی به فارسی تبدیل شدند.',
                    type: 'success'
                });
                showToast('متن با موفقیت اصلاح شد.', 'success');
            };

            const handleCreateRequest = async (e) => {
                e.preventDefault();
                if (!currentUser) return;
                if (!newTitle.trim() || !newAmount) {
                    showToast('عنوان و مبلغ درخواست الزامی هستند.', 'warning');
                    return;
                }

                setLoading(true);
                try {
                    let expiryDate = null;
                    if (newExpiryShamsi.trim()) {
                        const parts = newExpiryShamsi.split('/');
                        if (parts.length === 3) {
                            const jYear = parseInt(parts[0]);
                            const jMonth = parseInt(parts[1]);
                            const jDay = parseInt(parts[2]);
                            let gYear, gMonth, gDay;
                            if (jMonth > 9) {
                                gYear = jYear + 621;
                                gMonth = jMonth - 9;
                                gDay = jDay;
                            } else {
                                gYear = jYear + 622;
                                gMonth = jMonth + 3;
                                gDay = jDay;
                            }
                            expiryDate = new Date(gYear, gMonth - 1, gDay).toISOString();
                        }
                    }

                    let fileUrl = null;
                    let filePath = null;
                    let fileOriginalName = null;
                    let fileType = null;

                    if (newFile) {
                        setUploadingFile(true);
                        try {
                            fileOriginalName = newFile.name;
                            fileType = newFile.type;
                            const uploadResult = await uploadFileToStorage(newFile);
                            fileUrl = uploadResult.url;
                            filePath = uploadResult.filePath;

                            console.error(uploadErr);
                            showToast('خطا در آپلود فایل ضمیمه. درخواست بدون فایل ثبت می‌شود.', 'warning');
                        } finally {
                            setUploadingFile(false);
                        }
                    }

                    const reqId = Date.now().toString();
                    const newRequest = {
                        reqId,
                        title: newTitle.trim(),
                        amount: Number(newAmount),

                        expiryDate,
                        expiryDateShamsi: newExpiryShamsi.trim() || null,

                        status: 'pending',
                        events: [{ time: new Date().toISOString(), action: 'ایجاد درخواست و ارسال جهت امضا' }],

                    };

                    showToast('خطا در ثبت درخواست جدید: ' + msg, 'error');
                } finally {
                    setLoading(false);

            const handleDeleteRequest = async (req) => {
                if (!confirm('آیا از حذف این درخواست اطمینان دارید؟')) return;
                if (!currentUser) return;

                setLoading(true);

            };

            const handleRejectRequest = async (reqId) => {
                if (!confirm('آیا از رد کردن این درخواست اطمینان دارید؟')) return;
                if (!currentUser) return;

                setLoading(true);
                try {
                    await safeUpdateRequest(reqId, { status: 'rejected' });

                }

            const handleReverseReject = async (reqId) => {
                if (!currentUser) return;
                setLoading(true);
                try {
                    await safeUpdateRequest(reqId, { status: 'pending' });
                    showToast('درخواست مجدداً به جریان افتاد.', 'success');
                    fetchData();
                } catch (err) {
                    console.error(err);
                    showToast('خطا در فعال‌سازی مجدد درخواست: ' + (err.message || JSON.stringify(err)), 'error');
                } finally {
                    setLoading(false);
                }
            };

            // Canvas Handlers
            const initCanvas = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * devicePixelRatio;
                canvas.height = rect.height * devicePixelRatio;
                ctx.scale(devicePixelRatio, devicePixelRatio);
                
                ctx.lineWidth = 3.5;
                ctx.strokeStyle = '#1e293b';
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            };

            useEffect(() => {
                if (selectedRequest) {
                    const hasSigned = selectedRequest.signatures.some(s => s.signer === currentUser?.username);
                    const isPending = selectedRequest.status === 'pending';
                    const isSigner = currentUser?.role === 'signer';
                    
                    if (isSigner && isPending && !hasSigned) {
                        setTimeout(initCanvas, 100);
                    }
                }
            }, [selectedRequest, currentUser]);

            const getCanvasMousePos = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                
                return {
                    x: (clientX - rect.left) * (canvas.width / (rect.width * devicePixelRatio)),
                    y: (clientY - rect.top) * (canvas.height / (rect.height * devicePixelRatio))
                };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                const pos = getCanvasMousePos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                const pos = getCanvasMousePos(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            const handleSubmitSignature = async () => {
                const canvas = canvasRef.current;
                if (!canvas || !selectedRequest || !currentUser) return;
                
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                const buffer = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let isEmpty = true;
                for (let i = 0; i < buffer.data.length; i += 4) {
                    if (buffer.data[i + 3] > 0) {
                        isEmpty = false;
                        break;
                    }
                }

                if (isEmpty) {
                    showToast('لطفاً ابتدا روی بوم امضا را ترسیم کنید.', 'warning');
                    return;
                }

                const dataUrl = canvas.toDataURL('image/png');
                setLoading(true);

                try {
                    const updatedSignatures = [...(selectedRequest.signatures || [])];
                    updatedSignatures.push({
                        signer: currentUser.username,
                        displayName: currentUser.displayName || currentUser.username,
                        time: new Date().toISOString(),
                        dataUrl
                    });

                    const hasKhaaneh = updatedSignatures.some(s => signerRoles.khaaneh === s.signer);
                    const hasRaees = updatedSignatures.some(s => signerRoles.raees === s.signer);
                    const hasNaeb = updatedSignatures.some(s => signerRoles.naeb === s.signer);

                    let newStatus = selectedRequest.status;
                    if (hasKhaaneh && (hasRaees || hasNaeb) && updatedSignatures.length >= 2) {
                        newStatus = 'approved';
                    }

                    const updatedEvents = [...(selectedRequest.events || [])];
                    updatedEvents.push({
                        time: new Date().toISOString(),
                        action: `امضا توسط ${currentUser.displayName || currentUser.username} (${getRoleLabel(currentUser.username)})`
                    });

                    if (newStatus === 'approved') {
                        updatedEvents.push({
                            time: new Date().toISOString(),
                            action: 'تأیید نهایی درخواست به دلیل تکمیل ترکیب امضاها'
                        });
                    }

                    await safeUpdateRequest(selectedRequest.reqId, {
                        signatures: updatedSignatures,
                        status: newStatus,
                        events: updatedEvents
                    });

                    showToast(
                        newStatus === 'approved' 
                            ? 'درخواست به دلیل تکمیل امضاها با موفقیت تأیید نهایی شد!' 
                            : 'امضای شما با موفقیت ثبت گردید.', 
                        'success'
                    );

                    const updatedReq = {
                        ...selectedRequest,
                        signatures: updatedSignatures,
                        status: newStatus,
                        events: updatedEvents
                    };
                    setSelectedRequest(updatedReq);
                    fetchData();
                } catch (err) {
                    console.error(err);
                    showToast('خطا در ثبت امضا: ' + (err.message || JSON.stringify(err)), 'error');
                } finally {
                    setLoading(false);
                }
            };

            // Number to Words Converter
            const numberToPersianWords = (num) => {
                if (num === 0) return 'صفر';
                
                const yekan = ['', 'یک', 'دو', 'سه', 'چهار', 'پنج', 'شش', 'هفت', 'هشت', 'نه'];
                const dahgan = ['', 'ده', 'بیست', 'سی', 'چهل', 'پنجاه', 'شصت', 'هفتاد', 'هشتاد', 'نود'];
                const dah_ta_nuzdah = ['ده', 'یازده', 'دوازده', 'سیزده', 'چهارده', 'پانزده', 'شانزده', 'هفده', 'هجده', 'نوزده'];
                const sadgan = ['', 'صد', 'doyest', 'سیصد', 'چهارصد', 'پانصد', 'ششصد', 'هفتصد', 'هشتصد', 'نهصد'];
                const tables = ['', 'هزار', 'میلیون', 'میلیارد', 'تریلیون'];
                
                const convertThreeDigits = (n) => {
                    if (n === 0) return '';
                    let res = [];
                    
                    const s = Math.floor(n / 100);
                    const d = Math.floor((n % 100) / 10);
                    const y = n % 10;
                    
                    if (s > 0) {
                        if (s === 2) res.push('دویست');
                        else res.push(sadgan[s]);
                    }
                    
                    if (d === 1) {
                        res.push(dah_ta_nuzdah[y]);
                    } else {
                        if (d > 0) res.push(dahgan[d]);
                        if (y > 0) res.push(yekan[y]);
                    }
                    
                    return res.join(' و ');
                };
                
                let parts = [];
                let temp = num;
                let unitIdx = 0;
                
                while (temp > 0) {
                    const chunk = temp % 1000;
                    if (chunk > 0) {
                        const chunkStr = convertThreeDigits(chunk);
                        const unit = tables[unitIdx];
                        parts.unshift(chunkStr + (unit ? ' ' + unit : ''));
                    }
                    temp = Math.floor(temp / 1000);
                    unitIdx++;
                }
                
                return parts.join(' و ') + ' تومان';
            };

            // PDF Generation helpers
            const textToCanvasURL = (text, fontSize, color = '#1e293b', maxWidth) => {
                const c = document.createElement('canvas');
                const ctx2 = c.getContext('2d');
                if (!ctx2) return { dataUrl: '', width: 100, height: 10 };
                
                ctx2.font = `${fontSize}px Vazirmatn, Tahoma, sans-serif`;
                const metrics = ctx2.measureText(text);
                const padding = 20;
                const width = Math.min(metrics.width + padding, maxWidth || 1000);
                const height = fontSize * 1.8;
                
                c.width = width * 2;
                c.height = height * 2;
                
                ctx2.scale(2, 2);
                ctx2.font = `${fontSize}px Vazirmatn, Tahoma, sans-serif`;
                ctx2.fillStyle = color;
                ctx2.textAlign = 'right';
                ctx2.textBaseline = 'middle';
                ctx2.fillText(text, width - 10, height / 2);
                
                return {
                    dataUrl: c.toDataURL('image/png'),
                    width: width,
                    height: height
                };
            };

            const textLinesToCanvasURL = (text, fontSize, color = '#334155', maxWidth = 600) => {
                const c = document.createElement('canvas');
                const ctx2 = c.getContext('2d');
                if (!ctx2) return { dataUrl: '', width: maxWidth, height: 20 };
                
                ctx2.font = `${fontSize}px Vazirmatn, Tahoma, sans-serif`;
                
                const lines = [];
                const words = text.split(' ');
                const maxLineWidth = maxWidth - 20;
                let currentLine = '';
                
                for (let word of words) {
                    const testLine = currentLine ? currentLine + ' ' + word : word;
                    if (ctx2.measureText(testLine).width > maxLineWidth && currentLine) {
                        lines.push(currentLine);
                        currentLine = word;
                    } else {
                        currentLine = testLine;
                    }
                }
                if (currentLine) lines.push(currentLine);
                
                const lineHeight = fontSize * 1.6;
                const height = lineHeight * lines.length + 15;
                
                c.width = maxWidth * 2;
                c.height = height * 2;
                
                ctx2.scale(2, 2);
                ctx2.font = `${fontSize}px Vazirmatn, Tahoma, sans-serif`;
                ctx2.fillStyle = color;
                ctx2.textAlign = 'right';
                
                lines.forEach((line, i) => {
                    ctx2.fillText(line, maxWidth - 10, (i + 0.8) * lineHeight);
                });
                
                return {
                    dataUrl: c.toDataURL('image/png'),
                    width: maxWidth,
                    height: height
                };
            };

            const buildPDFDoc = async (req) => {

                doc.addImage(reqTitleObj.dataUrl, 'PNG', 105, 42, reqTitlePdfWidth, reqTitlePdfHeight);

                const descText = req.description || 'توضیحی ثبت نشده است.';
                const descObj = textLinesToCanvasURL(descText, 11, '#334155', 170 * 3.5);

                doc.setFillColor(248, 250, 252);
                doc.roundedRect(15, 54 + reqTitlePdfHeight + reqAmountPdfHeight + detailsHeaderPdfHeight, 180, descPdfHeight + 6, 3, 3, 'F');
                doc.addImage(descObj.dataUrl, 'PNG', 20, 57 + reqTitlePdfHeight + reqAmountPdfHeight + detailsHeaderPdfHeight, descPdfWidth, descPdfHeight);

                if (req.expiryDateShamsi) {

                    const expiryObj = textToCanvasURL(expiryText, 11, '#b45309', 400);

                }

                const sigTitleObj = textToCanvasURL('کادرهای تایید و امضا دیجیتال اعضا:', 13, '#1e293b', 400);
                const sigTitlePdfWidth = 80;
                const sigTitlePdfHeight = (sigTitleObj.height / sigTitleObj.width) * sigTitlePdfWidth;
                
                const sigStartY = 85 + reqTitlePdfHeight + reqAmountPdfHeight + detailsHeaderPdfHeight + descPdfHeight;
                doc.addImage(sigTitleObj.dataUrl, 'PNG', 115, sigStartY, sigTitlePdfWidth, sigTitlePdfHeight);

                const raeesSig = req.signatures.find(s => signerRoles.raees === s.signer);
                const khaanehSig = req.signatures.find(s => signerRoles.khaaneh === s.signer);
                const naebSig = req.signatures.find(s => signerRoles.naeb === s.signer);

                const slots = [
                    { 
                        roleName: 'خزانه‌دار (الزامی)', 
                        userName: users.find(u => u.username === signerRoles.khaaneh)?.displayName || signerRoles.khaaneh,
                        x: 18, 
                        y: sigStartY + sigTitlePdfHeight + 6,

                    },
                    { 
                        roleName: 'رئیس هیئت مدیره', 
                        userName: users.find(u => u.username === signerRoles.raees)?.displayName || signerRoles.raees,
                        x: 78, 
                        y: sigStartY + sigTitlePdfHeight + 6,
